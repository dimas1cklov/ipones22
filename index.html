<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phone Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#D4FF3A;--bg:#0E0E12;--card:#17171D;--line:#24242C;--line2:#2A2A33;--ink:#F5F5F7;--muted:#9C9BA6;--tile:#F5F5F7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050507;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{width:834px;height:1194px;flex-shrink:0;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;border-radius:40px;transform-origin:center center}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
input{font:inherit}
input::placeholder{color:#7C7B86}
.display{font-family:Unbounded,Inter,sans-serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shop */
#shop{position:absolute;inset:0;display:flex;flex-direction:column;transition:filter .35s ease,transform .35s ease}
#app.busy #shop{filter:blur(18px);transform:scale(.97)}
#dim{position:absolute;inset:0;background:rgba(8,8,12,.5);opacity:0;pointer-events:none;transition:opacity .3s}
#app.busy #dim{opacity:1}
.top{padding:40px 40px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.kicker{font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:8px 0 0;font-size:46px;line-height:1;font-weight:800;letter-spacing:-.03em}
.badge{width:64px;height:64px;border-radius:22px;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)}
.tickerWrap{margin-top:22px;height:44px;background:var(--accent);color:var(--bg);overflow:hidden;display:flex;align-items:center;transform:rotate(-1.2deg);width:900px;margin-left:-30px;flex-shrink:0}
.ticker{display:flex;white-space:nowrap;font-size:16px;font-weight:700;letter-spacing:.02em;animation:ticker 26s linear infinite}
.ticker span{padding-right:28px}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.bar{padding:24px 40px 18px;display:flex;gap:10px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;background:#1A1A21;border:1px solid var(--line2);border-radius:18px}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;color:var(--ink)}
.chip{height:52px;padding:0 18px;border-radius:18px;font-size:15px;font-weight:600;background:transparent;color:var(--ink);border:1px solid var(--line2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gridWrap{flex:1;min-height:0;padding:0 40px 20px;overflow-y:auto;scrollbar-width:none}
.gridWrap::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:252px;gap:16px}
.card{border:1px solid var(--line);margin:0;text-align:left;background:var(--card);border-radius:28px;padding:10px;display:flex;flex-direction:column;gap:12px;transition:transform .2s ease}
.card:active{transform:scale(.97)}
.card.hero{grid-column:span 2;grid-row:span 2}
.tile{position:relative;flex:1;min-height:120px;border-radius:20px;background:var(--tile);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile img{max-width:84%;max-height:86%;object-fit:contain;mix-blend-mode:multiply}
.new{position:absolute;top:10px;left:10px;padding:5px 10px;border-radius:999px;background:var(--bg);color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.08em}
.cardFoot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:0 6px 6px}
.cardName{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.card.hero .cardName{font-size:30px}
.meta{display:flex;align-items:center;gap:8px;margin-top:6px}
.dots{display:flex;gap:4px}
.dots span{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sub{font-size:12px;color:var(--muted)}
.rating{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--accent)}
.empty{margin:60px 0 0;text-align:center;font-size:17px;color:var(--muted)}
nav{margin:0 40px 26px;height:74px;flex-shrink:0;border-radius:26px;background:var(--card);border:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}
nav button{border:0;width:56px;height:52px;border-radius:18px;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center}
nav button.on{background:var(--accent);color:var(--bg)}

/* layer */
#layer{position:absolute;inset:0;pointer-events:none}
#layer > *{pointer-events:auto}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal{position:relative;width:660px;max-height:1140px;overflow-y:auto;background:var(--card);border:1px solid var(--line2);border-radius:40px;padding:28px;display:flex;flex-direction:column;gap:20px;box-shadow:0 40px 100px -30px rgba(0,0,0,.8);scrollbar-width:none}
.modal::-webkit-scrollbar{display:none}
.pop{animation:pop .4s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{transform:scale(.84) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.slide{animation:slide .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.mHead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.steps{display:flex;align-items:center;gap:10px}
.steps i{display:block;width:28px;height:6px;border-radius:3px;background:var(--line2)}
.steps i.on{background:var(--accent)}
.stepLabel{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.x{border:0;width:44px;height:44px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center}
.section{display:flex;flex-direction:column;gap:20px}
.hero-img{position:relative;height:340px;border-radius:28px;background:var(--tile);display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-img img{max-width:82%;max-height:88%;object-fit:contain;mix-blend-mode:multiply}
.colorTag{position:absolute;left:16px;bottom:16px;padding:6px 12px;border-radius:999px;background:var(--bg);color:var(--ink);font-size:13px;font-weight:600}
.titleRow{display:flex;justify-content:space-between;align-items:center;gap:16px}
h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em}
.swatches{display:flex;gap:10px}
.sw{border:0;width:46px;height:46px;border-radius:50%;transition:box-shadow .2s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent)}
.label{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.group{display:flex;flex-direction:column;gap:10px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{min-height:80px;padding:10px 12px;border-radius:22px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;background:transparent;color:var(--ink);border:1px solid var(--line2)}
.opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.sim.on{background:var(--line);color:var(--ink);border-color:var(--accent)}
.ok{height:62px;border:0;border-radius:22px;font-size:18px;font-weight:700;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:10px}
.mini{display:flex;align-items:center;gap:16px;padding:12px;border-radius:24px;background:#0F0F14;border:1px solid var(--line)}
.mini .thumb{width:80px;height:80px;flex-shrink:0;border-radius:18px;background:var(--tile);display:flex;align-items:center;justify-content:center;overflow:hidden}
.mini .thumb img{max-width:86%;max-height:86%;object-fit:contain;mix-blend-mode:multiply}
.mini b{display:block;font-size:18px;letter-spacing:-.02em}
.mini small{display:block;margin-top:4px;font-size:14px;color:var(--muted)}
.ghost{height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:transparent;font-size:14px;font-weight:600}
.field{display:flex;flex-direction:column;gap:8px}
.inputRow{display:flex;align-items:center;gap:8px;height:60px;padding:0 8px 0 18px;border-radius:18px;background:#0F0F14;border:1px solid var(--line);transition:border-color .2s}
.inputRow.filled{border-color:#3A3A44}
.inputRow input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:17px;color:var(--ink)}
.paste{height:44px;padding:0 14px;border-radius:14px;border:0;background:var(--accent);color:var(--bg);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.paste:active{transform:scale(.95)}
.accept{height:64px;border:0;border-radius:22px;font-size:18px;font-weight:700;background:var(--line);color:var(--muted);cursor:not-allowed;transition:background .25s,color .25s}
.accept.ready{background:var(--accent);color:var(--bg);cursor:pointer}

/* pack */
.packBox{position:relative;width:380px;height:560px}
.dropClip{position:absolute;left:0;top:0;width:380px;height:530px;overflow:hidden}
.drop{position:absolute;left:95px;top:60px;width:190px;height:240px;display:flex;align-items:center;justify-content:center;animation:drop .55s cubic-bezier(.5,0,.6,1) both}
.drop img{max-width:100%;max-height:100%;object-fit:contain}
.drop img.cut{filter:drop-shadow(0 24px 30px rgba(0,0,0,.55))}
.drop img.soft{-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%)}
@keyframes drop{0%,25%{transform:translateY(-60px);opacity:1}75%{transform:translateY(200px);opacity:1}100%{transform:translateY(230px);opacity:0}}
.box{position:absolute;left:10px;bottom:0;width:360px;height:220px;animation:boxJump .9s ease both}
@keyframes boxJump{0%,85%{transform:none}92%{transform:translateY(-14px)}100%{transform:none}}
.flapL,.flapR{position:absolute;top:0;width:180px;height:24px;background:#E2AE66}
.flapL{left:0;border-radius:8px 0 0 0;transform-origin:0 100%;animation:flapL .9s ease-in-out both}
.flapR{right:0;border-radius:0 8px 0 0;transform-origin:100% 100%;animation:flapR .9s ease-in-out both}
@keyframes flapL{0%,55%{transform:rotate(-125deg)}85%,100%{transform:rotate(0)}}
@keyframes flapR{0%,55%{transform:rotate(125deg)}85%,100%{transform:rotate(0)}}
.boxBody{position:absolute;left:0;top:22px;width:360px;height:198px;background:#D69A4E;border-radius:8px 8px 18px 18px;box-shadow:inset 0 -24px 0 rgba(0,0,0,.08)}
.tape{position:absolute;left:152px;top:0;width:56px;height:90px;background:#F1D59B;border-radius:5px;animation:tape .9s ease both}
@keyframes tape{0%,85%{opacity:0;transform:scaleX(0)}100%{opacity:1;transform:none}}
.sticker{position:absolute;left:26px;bottom:32px;padding:6px 12px;border-radius:8px;background:#fff;font-size:16px;font-weight:800;color:var(--bg)}
.arrows{position:absolute;right:26px;bottom:32px}
.big{margin:0;font-size:26px;font-weight:800;text-align:center}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* truck */
.drive{position:relative;width:380px;height:200px;animation:drive 2s cubic-bezier(.45,0,.55,1) both}
@keyframes drive{0%{transform:translateX(-760px)}32%,62%{transform:translateX(0)}100%{transform:translateX(900px)}}
.speed{position:absolute;left:-70px;top:70px;display:flex;flex-direction:column;gap:18px}
.speed i{display:block;height:6px;border-radius:3px;background:var(--accent);animation:lines .5s linear infinite}
@keyframes lines{from{transform:translateX(0);opacity:.9}to{transform:translateX(-60px);opacity:0}}
.bounce{animation:bounce .32s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* done */
.done{gap:36px;padding:0 48px}
.clocks{display:flex;gap:28px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:none}50%{transform:translateY(-12px) scale(1.06)}}
.tick{transform-box:view-box;transform-origin:24px 24px;animation:spin 2.4s linear infinite}
.tickFast{transform-box:view-box;transform-origin:24px 24px;animation:spin .8s linear infinite}
.summary{width:100%;max-width:720px;border-radius:32px;background:var(--card);border:1px solid var(--line2);padding:14px 36px;display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:24px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span{font-size:18px;font-weight:600;color:#A9A8B3;flex-shrink:0}
.row b{font-size:22px;font-weight:700;line-height:1.3;text-align:right}
.back{height:58px;padding:0 32px;border:0;border-radius:20px;background:var(--accent);color:var(--bg);font-size:16px;font-weight:700}
.confettiBox{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.confettiSheet{position:absolute;left:0;top:0;width:100%;height:1250px;will-change:transform;animation:confettiSheet 2.6s linear both}
.confettiSheet span{position:absolute}
@keyframes confettiSheet{from{transform:translate3d(0,-1300px,0)}to{transform:translate3d(0,1250px,0)}}
</style>
</head>

<div id="stage">
  <div id="app">
    <div id="shop">
      <div class="top">
        <div>
          <div class="kicker">Phone Drop · Season 2026</div>
          <h1 class="display">Pick your <span style="color:var(--accent)">drop</span></h1>
        </div>
        <div class="badge" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        </div>
      </div>
      <div class="tickerWrap" aria-hidden="true">
        <div class="ticker display">
          <span>IPHONE 18 PRO ✦ IPHONE DUO ✦ AIRPODS MAX ✦ MACBOOK PRO ✦ FREE DELIVERY ✦ PICK YOUR COLOR ✦</span>
          <span>IPHONE 18 PRO ✦ IPHONE DUO ✦ AIRPODS MAX ✦ MACBOOK PRO ✦ FREE DELIVERY ✦ PICK YOUR COLOR ✦</span>
        </div>
      </div>
      <div class="bar">
        <label class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9C9BA6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span class="sr">Search</span>
          <input id="q" type="search" placeholder="Search" autocomplete="off">
        </label>
        <div id="chips" style="display:flex;gap:10px"></div>
      </div>
      <div class="gridWrap"><div class="grid" id="grid"></div><div id="empty"></div></div>
      <nav aria-label="Navigation">
        <button class="on" aria-label="Store"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
        <button aria-label="Profile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
        <button aria-label="Notifications"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg></button>
        <button aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
      </nav>
    </div>
    <div id="dim"></div>
    <div id="layer"></div>
  </div>
</div>

        return '<div class="group"><span class="label">' + esc(g.t) + '</span><div class="opts">' + g.v.map(function (v, vi) {
          var on = (S.opts[gi] || 0) === vi;
          var icon = g.sim ? '<svg width="30" height="37" viewBox="0 0 18 22" aria-hidden="true"><path d="M1 3a2 2 0 0 1 2-2h8l6 6v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="' + ['#8B7BFF', '#FF4F8B', '#2DB8FF'][vi % 3] + '"/><rect x="5" y="9" width="8" height="8" rx="1.5" fill="#F6D06B"/></svg>' : '';
          return '<button class="opt' + (g.sim ? ' sim' : '') + (on ? ' on' : '') + '" data-act="opt" data-g="' + gi + '" data-v="' + vi + '">' + icon + esc(v) + '</button>';
        }).join('') + '</div></div>';
      }).join('') +
      '<button class="ok display" data-act="toForm">Okay <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>' +
      '</div>';
  }
  var FIELDS = [
    { key: 'fName', label: 'Full name', ph: 'Your name', type: 'text' },
    { key: 'fAddr', label: 'Address', ph: 'Street, apt, city, ZIP', type: 'text' },
    { key: 'fPhone', label: 'Phone', ph: '+1 (___) ___-____', type: 'tel' }
  ];
  function renderForm() {
    var p = product(), col = color();
    var m = ensureModal();
    m.innerHTML = modalHead(2) +
      '<div class="section slide">' +
      '<div class="mini"><div class="thumb"><img src="' + col.img + '" alt=""></div><div style="flex:1;min-width:0"><b class="display">' + esc(p.name) + '</b><small>' + esc(specs()) + '</small></div>' +
      '<button class="ghost" data-act="toConfig">Edit</button></div>' +
      '<h2 class="display" style="font-size:26px">Where should we ship it?</h2>' +
      FIELDS.map(function (f) {
        return '<label class="field"><span class="label" style="font-size:12px">' + f.label + '</span>' +
          '<div class="inputRow' + (S[f.key].trim() ? ' filled' : '') + '" id="row_' + f.key + '">' +
          '<input id="in_' + f.key + '" data-field="' + f.key + '" type="' + f.type + '" placeholder="' + esc(f.ph) + '" value="' + esc(S[f.key]) + '" autocomplete="off">' +
          '<button class="paste" data-act="paste" aria-label="Paste ' + f.label + '">' + PASTE_ICON + 'Paste</button></div></label>';
      }).join('') +
      '<button class="accept display" id="accept" data-act="accept"></button>' +
      '</div>';
    updateForm();
  }
  function updateForm() {
    FIELDS.forEach(function (f) {
      var row = document.getElementById('row_' + f.key), inp = document.getElementById('in_' + f.key);
      if (row) row.classList.toggle('filled', !!S[f.key].trim());
      if (inp && inp.value !== S[f.key]) inp.value = S[f.key];
    });
    var a = document.getElementById('accept');
    if (a) { var r = ready(); a.classList.toggle('ready', r); a.disabled = !r; a.textContent = r ? 'Accept' : 'Fill in all fields'; }
  }

  /* ---------- order animation ---------- */
  function renderPack() {
    var p = product(), col = color();
    var img = col.cut ? '<img class="cut" src="' + col.cut + '" alt="">' : '<img class="soft" src="' + col.img + '" alt="">';
    layer.innerHTML = '<div class="center" style="gap:40px"><div class="packBox">' +
      '<div class="dropClip"><div class="drop">' + img + '</div></div>' +
      '<div class="box"><div class="flapL"></div><div class="flapR"></div><div class="boxBody"></div><div class="tape"></div>' +
      '<div class="sticker">' + esc(p.name) + '</div>' +
      '<svg class="arrows" width="52" height="36" viewBox="0 0 64 44" aria-hidden="true"><path d="M8 30l8-14 8 14M16 16v24M40 8h16v16H40z" fill="none" stroke="#8A5A22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
      '</div><p class="big display fade">Packing your order…</p></div>';
  }
  function wheel(cx) {
    return '<g class="spin"><circle cx="' + cx + '" cy="158" r="26" fill="#2A2A33"/><circle cx="' + cx + '" cy="158" r="11" fill="#D9D6D0"/><rect x="' + (cx - 3) + '" y="136" width="6" height="12" fill="#D9D6D0"/></g>';
  }
  function renderTruck() {
    var fn = esc(firstName());
    layer.innerHTML = '<div class="center" style="gap:36px"><div class="drive">' +
      '<div class="speed"><i style="width:60px"></i><i style="width:40px;margin-left:20px"></i><i style="width:54px"></i></div>' +
      '<svg width="380" height="200" viewBox="0 0 380 200" role="img" aria-label="Delivery truck"><g class="bounce">' +
      '<rect x="10" y="20" width="230" height="130" rx="14" fill="#FF7A1A"/><rect x="10" y="128" width="230" height="22" fill="#E3620A"/>' +
      '<text x="125" y="78" text-anchor="middle" font-family="Unbounded, Inter, sans-serif" font-size="24" font-weight="800" fill="#0E0E12">DELIVERY</text>' +
      '<text x="125" y="106" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0E0E12">for ' + fn + '</text>' +
      '<path d="M246 56h68c8 0 14 4 18 10l30 44c4 6 6 12 6 20v20H246z" fill="#FFB020"/><path d="M262 70h50l26 38h-76z" fill="#BFE3FF"/>' +
      '<rect x="246" y="128" width="122" height="22" fill="#E39410"/><rect x="358" y="120" width="14" height="10" rx="3" fill="#FFF5C2"/></g>' +
      wheel(70) + wheel(180) + wheel(314) + '</svg></div>' +
      '<p class="big display fade">' + fn + ', your order is on its way!</p></div>';
  }
  function confetti() {
    var colors = ['#D4FF3A', '#FF7A1A', '#8B7BFF', '#FF4F8B', '#2DB8FF', '#F5F5F7', '#FFB020'], out = '';
    for (var i = 0; i < 90; i++) {
      var round = Math.random() < 0.3, w = 8 + Math.floor(Math.random() * 8);
      out += '<span style="left:' + Math.floor(Math.random() * 100) + '%;top:' + Math.floor(Math.random() * 100) + '%;width:' + w + 'px;height:' + (round ? w : w * 1.8) +
        'px;background:' + colors[i % colors.length] + ';border-radius:' + (round ? '50%' : '2px') + ';transform:rotate(' + Math.floor(Math.random() * 180) + 'deg)"></span>';
    }
    return '<div class="confettiBox" aria-hidden="true"><div class="confettiSheet">' + out + '</div></div>';
  }
  function clock(delay) {
    return '<div class="pulse" style="animation-delay:' + delay + '"><svg width="76" height="76" viewBox="0 0 48 48" aria-hidden="true">' +
      '<circle cx="24" cy="24" r="21" fill="#17171D" stroke="#D4FF3A" stroke-width="3"/><circle cx="24" cy="24" r="2.5" fill="#F5F5F7"/>' +
      '<g class="tick"><path d="M24 24V12" stroke="#F5F5F7" stroke-width="2.6" stroke-linecap="round"/></g>' +
      '<g class="tickFast"><path d="M24 24h9" stroke="#D4FF3A" stroke-width="2.2" stroke-linecap="round"/></g></svg></div>';
  }
  function renderDone() {
    var p = product();
    var rows = [['Order', p.name + ', ' + specs()], ['Recipient', S.fName.trim()], ['Address', S.fAddr.trim()], ['Phone', S.fPhone.trim()]];
    layer.innerHTML = confetti() +
      '<div class="center done fade"><div class="clocks">' + clock('0s') + clock('.2s') + clock('.4s') + '</div>' +
      '<h2 class="display" style="font-size:32px;text-align:center">Courier is on the way, ' + esc(firstName()) + '</h2>' +
      '<div class="summary">' + rows.map(function (r) { return '<div class="row"><span>' + r[0] + '</span><b>' + esc(r[1]) + '</b></div>'; }).join('') + '</div>' +
      '<button class="back display" data-act="reset">Back to store</button></div>';
  }

  /* ---------- stage control ---------- */
  function go(stage) {
    S.stage = stage;
    app.classList.toggle('busy', stage !== 'shop');
    if (stage === 'shop') layer.innerHTML = '';
    else if (stage === 'config') renderConfig();
    else if (stage === 'form') renderForm();
    else if (stage === 'pack') renderPack();
    else if (stage === 'truck') renderTruck();
    else if (stage === 'done') renderDone();
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
    if (act === 'cat') { S.cat = v; renderChips(); renderGrid(); }
    else if (act === 'open') { S.sel = v; S.color = 0; S.opts = [0, 0, 0]; go('config'); }
    else if (act === 'close') go('shop');
    else if (act === 'color') { S.color = +v; renderConfig(); }
    else if (act === 'opt') { S.opts[+b.getAttribute('data-g')] = +v; renderConfig(); }
    else if (act === 'toForm') go('form');
    else if (act === 'toConfig') go('config');
    else if (act === 'paste') { e.preventDefault(); S.fName = randomName(); S.fAddr = randomAddr(); S.fPhone = randomPhone(); updateForm(); }
    else if (act === 'accept') {
      if (!ready()) return;
      go('pack');
      later(950, function () { go('truck'); });
      later(950 + 2050, function () { go('done'); });
    }
    else if (act === 'reset') {
      timers.forEach(clearTimeout); timers = [];
      S.sel = null; S.fName = ''; S.fAddr = ''; S.fPhone = '';
      go('shop');
    }
  });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'q') { S.q = t.value; renderGrid(); return; }
    var k = t.getAttribute && t.getAttribute('data-field');
    if (k) { S[k] = t.value; updateForm(); }
  });

  function fit() {
    var s = Math.min(window.innerWidth / 834, window.innerHeight / 1194);
    app.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  renderChips();
  renderGrid();
})();
</script>
</body>
</html>
